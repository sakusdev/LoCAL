plugins { id 'com.android.application' }

android {
    namespace 'org.sakus.local'
    compileSdk 35
    defaultConfig {
        applicationId 'org.sakus.local'
        minSdk 26
        targetSdk 35
        versionCode 100
        versionName '0.1.0'
    }
    sourceSets { main { assets.srcDirs = ['../../../ui'] } }
    signingConfigs {
        release {
            def keyPath = System.getenv('ANDROID_KEYSTORE_PATH')
            if (keyPath) {
                storeFile file(keyPath)
                storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                keyAlias System.getenv('ANDROID_KEY_ALIAS')
                keyPassword System.getenv('ANDROID_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            if (System.getenv('ANDROID_KEYSTORE_PATH')) { signingConfig signingConfigs.release }
        }
    }
    splits {
        abi {
            enable true
            reset()
            include 'arm64-v8a', 'armeabi-v7a', 'x86_64'
            universalApk true
        }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
