name: Patch shutdown lock lifecycle
on:
  push:
    branches: [sol/screen-session-control]
    paths: [.github/workflows/fix-stop-lock.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Release instance lock during explicit shutdown
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('crates/local-core/src/lib.rs')
          text = path.read_text()
          needle = '        for cancel in self.cancellations.lock().unwrap().values() {\n            cancel.cancel();\n        }\n'
          replacement = needle + '        // Background connection tasks may retain Arc<Node> briefly after shutdown.\n        // Release the process-instance guard here so a deliberate restart does not\n        // depend on scheduler timing or task destruction.\n        let _ = FileExt::unlock(&self._lock);\n'
          if text.count(needle) != 1:
              raise SystemExit('expected Node::stop cancellation block not found exactly once')
          path.write_text(text.replace(needle, replacement, 1))
          PY
      - name: Commit lifecycle fix
        shell: bash
        run: |
          git config user.name 'LoCAL CI'
          git config user.email 'actions@users.noreply.github.com'
          git add crates/local-core/src/lib.rs
          git commit -m 'Release instance lock during explicit shutdown'
          git push origin "HEAD:${GITHUB_REF_NAME}"
