name: Wire screen pipeline
on:
  push:
    branches: [sol/screen-capture-quic-pipeline]
    paths: [.github/workflows/wire-screen-pipeline.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Patch capture polling and peer capability access
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('crates/local-screen/src/windows.rs')
          text = path.read_text()
          text = text.replace(
              'CaptureSource, CaptureSourceKind, EncodedCaptureBackend, EncodedCaptureSession,\n    EncodedVideoFrame, NegotiatedScreen, MAX_ENCODED_FRAME,',
              'CapturePoll, CaptureSource, CaptureSourceKind, EncodedCaptureBackend, EncodedCaptureSession,\n    EncodedVideoFrame, NegotiatedScreen, MAX_ENCODED_FRAME,',
              1,
          )
          text = text.replace(
              'sync::mpsc::{self, Receiver, SyncSender, TrySendError},',
              'sync::mpsc::{self, Receiver, RecvTimeoutError, SyncSender, TrySendError},',
              1,
          )
          needle = '''    fn next_frame(&mut self) -> Result<Option<EncodedVideoFrame>> {\n        match self.rx.recv() {\n            Ok(frame) => Ok(Some(frame)),\n            Err(_) => Ok(None),\n        }\n    }\n\n'''
          replacement = needle + '''    fn poll_frame(&mut self, timeout: Duration) -> Result<CapturePoll> {\n        Ok(match self.rx.recv_timeout(timeout) {\n            Ok(frame) => CapturePoll::Frame(frame),\n            Err(RecvTimeoutError::Timeout) => CapturePoll::Pending,\n            Err(RecvTimeoutError::Disconnected) => CapturePoll::Ended,\n        })\n    }\n\n'''
          if text.count(needle) != 1:
              raise SystemExit('Windows next_frame implementation not found exactly once')
          path.write_text(text.replace(needle, replacement, 1))

          path = Path('crates/local-core/src/lib.rs')
          text = path.read_text()
          needle = '''    fn session(&self, id: &str) -> Result<Arc<Session>> {\n        self.sessions\n            .lock()\n            .unwrap()\n            .get(id)\n            .cloned()\n            .context("Device is disconnected. Connect again")\n    }\n'''
          replacement = needle + '''    pub fn peer_screen_capabilities(\n        &self,\n        id: &str,\n    ) -> Result<protocol::ScreenCapabilities> {\n        let session = self.session(id)?;\n        if !session.ready() {\n            bail!("Confirm pairing on both devices first");\n        }\n        session\n            .peer\n            .screen\n            .clone()\n            .context("Peer does not advertise screen capabilities")\n    }\n'''
          if text.count(needle) != 1:
              raise SystemExit('Node session helper not found exactly once')
          path.write_text(text.replace(needle, replacement, 1))
          PY
          cargo fmt --all
      - name: Commit pipeline API wiring
        shell: bash
        run: |
          git config user.name 'LoCAL CI'
          git config user.email 'actions@users.noreply.github.com'
          git add crates/local-core/src/lib.rs crates/local-screen/src/lib.rs crates/local-screen/src/windows.rs
          git commit -m 'Wire bounded capture polling APIs'
          git push origin "HEAD:${GITHUB_REF_NAME}"
