name: Validate screen pipeline
on:
  push:
    branches: [sol/screen-capture-quic-pipeline]
    paths: [.github/workflows/validate-screen-pipeline.yml]
permissions:
  contents: read
jobs:
  validate:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Check desktop pipeline
        run: cargo check -p local-desktop
      - name: Run core and screen tests
        run: cargo test -p local-core -p local-screen
      - name: Clippy
        run: cargo clippy -p local-core -p local-screen -p local-desktop -- -D warnings
      - name: Formatting
        run: cargo fmt --all -- --check
