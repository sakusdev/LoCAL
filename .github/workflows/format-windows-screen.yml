name: Format Windows screen backend
on:
  push:
    branches: [sol/windows-screen-capture]
    paths: [.github/workflows/format-windows-screen.yml]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all
      - name: Commit formatting
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'Already formatted.'
            exit 0
          fi
          git config user.name 'LoCAL CI'
          git config user.email 'actions@users.noreply.github.com'
          git add crates/local-screen/src/lib.rs crates/local-screen/src/windows.rs
          git commit -m 'Apply rustfmt to Windows screen backend'
          git push origin "HEAD:${GITHUB_REF_NAME}"
