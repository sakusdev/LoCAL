name: Format screen session branch
on:
  push:
    branches: [sol/screen-session-control]
    paths: [.github/workflows/format-screen-session.yml]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all
      - name: Commit formatting
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'Already formatted.'
            exit 0
          fi
          git config user.name 'LoCAL CI'
          git config user.email 'actions@users.noreply.github.com'
          git add crates/local-core/src/protocol.rs crates/local-core/src/screen.rs
          git commit -m 'Apply rustfmt to screen session runtime'
          git push origin "HEAD:${GITHUB_REF_NAME}"
