name: Release
on:
  push:
    branches: [main]
    paths: [release.json, .github/workflows/release.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      prerelease: ${{ steps.release.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked -p local-core -p local-cli -p local-screen
      - run: cargo clippy --locked -p local-core -p local-cli -p local-android -p local-screen -- -D warnings
      - run: cargo fmt --all -- --check
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify desktop and mobile UI behavior
        working-directory: tests/ui
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm test
      - id: release
        run: |
          python3 - <<'PY'
          import json,os,re,tomllib
          config=json.load(open('release.json'))
          version=tomllib.load(open('Cargo.toml','rb'))['workspace']['package']['version']
          assert config['tag']==f'v{version}' and re.fullmatch(r'v\d+\.\d+\.\d+',config['tag'])
          with open(os.environ['GITHUB_OUTPUT'],'a') as out:
              out.write(f"tag={config['tag']}\nprerelease={str(config['prerelease']).lower()}\n")
          PY
  desktop:
    needs: verify
    name: Desktop / ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            platform: windows-x64
            bundles: nsis
          - os: windows-2022
            target: aarch64-pc-windows-msvc
            platform: windows-arm64
            bundles: nsis
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            platform: linux-x64
            bundles: deb,appimage
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            platform: linux-arm64
            bundles: deb,appimage
          - os: macos-15-intel
            target: x86_64-apple-darwin
            platform: macos-x64
            bundles: dmg
          - os: macos-15
            target: aarch64-apple-darwin
            platform: macos-arm64
            bundles: dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev librsvg2-dev patchelf libfuse2
      - name: Build native CLI
        run: cargo build --locked --release -p local-cli --target ${{ matrix.target }}
      - name: Test native file operations and QUIC sessions
        if: matrix.platform != 'windows-arm64'
        run: cargo test --locked -p local-core -p local-cli -p local-screen --target ${{ matrix.target }}
      - name: Install desktop build tooling
        working-directory: apps/desktop
        run: npm ci
      - name: Build desktop application and installers
        working-directory: apps/desktop
        run: npm run tauri build -- --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
        env:
          CI: true
          APPIMAGE_EXTRACT_AND_RUN: '1'
      - name: Package native artifacts
        run: python scripts/package-desktop.py ${{ matrix.target }} ${{ matrix.platform }}
      - uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14
  android:
    needs: verify
    name: Android / ARM64, ARMv7, x86_64, universal
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          key: android
          cache-on-failure: true
      - name: Install Android SDK and NDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install pinned Android platform and native toolchain
        run: |
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;27.2.12479018'
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
      - name: Build shared Rust core for every Android ABI
        run: bash scripts/build-android.sh
      - name: Configure optional production signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/local-release.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/local-release.jks" >> "$GITHUB_ENV"
            echo 'ANDROID_BUILD_TASK=assembleRelease' >> "$GITHUB_ENV"
            echo 'ANDROID_SIGNING=release' >> "$GITHUB_ENV"
          else
            echo 'ANDROID_BUILD_TASK=assembleDebug' >> "$GITHUB_ENV"
            echo 'ANDROID_SIGNING=debug' >> "$GITHUB_ENV"
          fi
      - name: Build installable Android packages
        working-directory: apps/android
        run: gradle --no-daemon ${{ env.ANDROID_BUILD_TASK }} assembleDebug assembleDebugAndroidTest lint
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      - name: Build Linux interoperability peer
        run: cargo build --locked --release -p local-cli
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android and Linux real QUIC interoperability
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_7
          disable-animations: true
          script: |
            python3 tests/android-peer.py target/release/local > android-peer.log 2>&1 &
            adb install apps/android/app/build/outputs/apk/debug/app-universal-debug.apk
            adb install apps/android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb shell pm grant org.sakus.local android.permission.POST_NOTIFICATIONS
            adb shell am instrument -w org.sakus.local.test/androidx.test.runner.AndroidJUnitRunner | tee android-instrumentation.log
            grep -q 'OK (1 test)' android-instrumentation.log
            test -f android-host-passed
            adb exec-out screencap -p > android-screen.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-interoperability
          path: |
            android-instrumentation.log
            android-peer.log
            android-screen.png
      - name: Verify and collect APKs
        run: |
          mkdir -p dist
          for apk in apps/android/app/build/outputs/apk/$ANDROID_SIGNING/*.apk; do
            "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify "$apk"
            name=$(basename "$apk")
            cp "$apk" "dist/LoCAL-0.1.0-android-${name#app-}"
          done
          python3 - <<'PY'
          import pathlib,zipfile
          apks=list(pathlib.Path('dist').glob('*.apk'))
          assert len(apks)==4, apks
          for path in apks:
              with zipfile.ZipFile(path) as z:
                  assert 'assets/index.html' in z.namelist()
                  assert 'assets/app.js' in z.namelist()
                  assert any(n.endswith('liblocal_android.so') for n in z.namelist())
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: packages-android
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-lint-report
          path: apps/android/app/build/reports/lint-results*.html
  publish:
    needs: [verify, desktop, android]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: packages-*
          path: dist
          merge-multiple: true
      - name: Create checksums and inventory
        run: |
          python3 - <<'PY'
          import pathlib,hashlib,json,os
          paths=sorted(pathlib.Path('dist').iterdir())
          assert len(paths)>=18, f'Incomplete release: {len(paths)} assets'
          inventory=[{'name':p.name,'size':p.stat().st_size,'sha256':hashlib.file_digest(p.open('rb'),'sha256').hexdigest()} for p in paths]
          pathlib.Path('dist/SHA256SUMS.txt').write_text(''.join(f"{p['sha256']}  {p['name']}\n" for p in inventory))
          pathlib.Path('dist/manifest.json').write_text(json.dumps({'commit':os.environ['GITHUB_SHA'],'artifacts':inventory},indent=2)+'\n')
          PY
      - name: Publish only after every platform passes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.verify.outputs.tag }}
          PRERELEASE: ${{ needs.verify.outputs.prerelease }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            existing=$(gh api "repos/$GITHUB_REPOSITORY/commits/$TAG" --jq .sha)
            test "$existing" = "$GITHUB_SHA" || { echo 'Refusing to overwrite a release from another commit'; exit 1; }
          else
            gh release create "$TAG" --target "$GITHUB_SHA" --title "LoCAL $TAG — LAN sharing preview" --notes-file docs/RELEASE_NOTES.md --draft
          fi
          gh release upload "$TAG" dist/* --clobber
          if [ "$PRERELEASE" = true ]; then
            gh release edit "$TAG" --draft=false --prerelease
          else
            gh release edit "$TAG" --draft=false --latest
          fi
