name: Fix Windows screen clippy
on:
  push:
    branches: [sol/windows-screen-capture]
    paths: [.github/workflows/fix-windows-screen-clippy.yml]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply clippy suggestions
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('crates/local-screen/src/windows.rs')
          text = path.read_text()
          replacements = {
              'profile.width % 2 != 0': '!profile.width.is_multiple_of(2)',
              'profile.height % 2 != 0': '!profile.height.is_multiple_of(2)',
              'for pixel in target.chunks_exact_mut(4) {': 'for pixel in target.as_chunks_mut::<4>().0 {',
          }
          for old, new in replacements.items():
              if text.count(old) != 1:
                  raise SystemExit(f'expected clippy target not found exactly once: {old}')
              text = text.replace(old, new, 1)
          path.write_text(text)
          PY
          cargo fmt --all
      - name: Commit clippy fixes
        shell: bash
        run: |
          git config user.name 'LoCAL CI'
          git config user.email 'actions@users.noreply.github.com'
          git add crates/local-screen/src/windows.rs
          git commit -m 'Apply Windows screen clippy fixes'
          git push origin "HEAD:${GITHUB_REF_NAME}"
