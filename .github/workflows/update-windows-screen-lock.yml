name: Update Windows screen lockfile
on:
  push:
    branches: [sol/windows-screen-capture]
    paths: [.github/workflows/update-windows-screen-lock.yml]
permissions:
  contents: write
jobs:
  lockfile:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo generate-lockfile
      - name: Commit lockfile
        shell: bash
        run: |
          if git diff --quiet -- Cargo.lock; then
            echo 'Cargo.lock is current.'
            exit 0
          fi
          git config user.name 'LoCAL CI'
          git config user.email 'actions@users.noreply.github.com'
          git add Cargo.lock
          git commit -m 'Lock Windows screen capture dependencies'
          git push origin "HEAD:${GITHUB_REF_NAME}"
