name: Update local-screen lockfile
on:
  push:
    branches: [sol/local-screen-core]
    paths: [.github/workflows/update-screen-lock.yml]
permissions:
  contents: write
jobs:
  update-lock:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo generate-lockfile
      - name: Commit generated lockfile
        shell: bash
        run: |
          if git diff --quiet -- Cargo.lock; then
            echo 'Cargo.lock is already current.'
            exit 0
          fi
          git config user.name 'LoCAL CI'
          git config user.email 'actions@users.noreply.github.com'
          git add Cargo.lock
          git commit -m 'Update Cargo.lock for local-screen'
          git push origin "HEAD:${GITHUB_REF_NAME}"
